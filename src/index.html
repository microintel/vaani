<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vaani</title>
<meta name="description" content="Vaani – real-time sign language detector">
<meta name="theme-color" content="#09090b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="icons/logo.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vaani">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="container topbar">
  <h1><img class="logo" src="icons/logo.svg" alt="" width="28" height="28">Vaani</h1>
  <div class="top-actions">
  <button id="installBtn" class="install-btn" type="button" hidden>Install</button>
  <button id="themeBtn" class="icon-btn" type="button" aria-label="Toggle theme">
    <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
  </div>
</header>

<main class="layout">
  <section class="card camera-card">
    <div class="stage">
      <video id="video" playsinline muted></video>
      <canvas id="canvas"></canvas>
      <div class="overlay" id="overlay"></div>
      <div id="status" class="pill">Idle</div>
    </div>
    <div class="row">
      <button id="startBtn">Start Camera</button>
      <button id="stopBtn" class="sec" disabled>Stop</button>
    </div>
  </section>

  <aside class="side">
    <div class="card">
      <div class="detected">
        <div class="big" id="big">–</div>
        <div class="name" id="name"></div>
        <div class="bar"><div id="hold"></div></div>
      </div>
    </div>

    <div class="card">
      <h2>Text</h2>
      <div class="out" id="out"></div>
      <div class="row">
        <button class="sec" id="spaceBtn">Space</button>
        <button class="sec" id="backBtn">Backspace</button>
        <button class="sec" id="clearBtn">Clear</button>
        <button id="speakBtn">Speak</button>
      </div>
    </div>
    <div class="card legend-card">
      <h2>Signs</h2>
      <div class="grid" id="legend"></div>
    </div>
  </aside>
</main>

<footer class="container footer">Developed by Chinnamma.Microintel</footer>

<!-- MediaPipe is loaded by js/tracker.js (local vendor copy first, CDN fallback) -->
<!-- App entry (ES modules) -->
<script type="module" src="js/main.js"></script>
</body>
</html>
